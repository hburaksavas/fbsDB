name: Desktop experiment

# Manual only. Tries the isolated WinUI/WebView2 desktop regression on a hosted runner. It is not part of Windows CI
# and no check depends on it; see docs/ci.md ("Separate integration checks").
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  desktop:
    name: Desktop regression (experiment)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Report WebView2 runtime and session
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 runtime: $((Get-ItemProperty $key).pv)" } else { "WebView2 runtime: not found" }
          "Session id: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId); user interactive: $([Environment]::UserInteractive)"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run desktop regression
        run: npm run test:desktop

      - name: Upload desktop test output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-experiment-${{ github.run_attempt }}
          path: .artifacts/desktop-regression/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
