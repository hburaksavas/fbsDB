name: Windows CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  validate:
    name: Windows validation
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check generated bridge contract
        run: npm run check:bridge

      - name: Check TypeScript bridge API
        run: npm run typecheck:bridge

      - name: Check history and query outcome types
        run: npm run typecheck:domain

      - name: Build web bundle
        run: npm run build

      - name: Check generated theme files
        run: git diff --exit-code -- src/themeTokens.css native/FbsDb/ThemeResources.xaml

      - name: Run JavaScript tests
        run: |
          New-Item -ItemType Directory -Path .artifacts/ci -Force | Out-Null
          npm test -- --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=.artifacts/ci/javascript-tests.xml

      - name: Run load smoke scenarios
        run: npm run test:load -- --profile smoke --enforce-budgets --output .artifacts/ci/load-smoke.json

      - name: Run native smoke tests without Oracle
        run: ./scripts/test-native.ps1

      - name: Run large TNS smoke without Oracle
        run: dotnet run --project tests/ScaleLoad/ScaleLoad.csproj -c Release -- tns 1000 1 .artifacts/ci/tns-load.json

      - name: Sync editor bundle to native host
        run: node scripts/sync-webcontent.mjs

      - name: Build Windows desktop app
        run: dotnet build native/FbsDb/FbsDb.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None -bl:.artifacts/ci/windows-build.binlog

      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-ci-${{ github.run_attempt }}
          path: .artifacts/ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
