name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  validate:
    uses: ./.github/workflows/windows-ci.yml

  publish:
    name: Package and publish
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Read release notes for this tag
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version." }
          $match = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding UTF8), "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no section for $version." }
          Set-Content -LiteralPath release-notes.md -Value $match.Groups[1].Value.Trim() -Encoding UTF8

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build portable package
        run: ./scripts/package-desktop.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            artifacts/fbsDB-win-x64.zip artifacts/fbsDB-win-x64.zip.sha256 `
            --verify-tag --title "fbsDB $env:GITHUB_REF_NAME" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
